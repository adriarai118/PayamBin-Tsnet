name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build tsnet AAR
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" || true
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          cd tsnet/go
          go mod tidy
          go vet ./...
          gomobile bind -target=android -androidapi 26 \
            -javapkg=com.adriarai.payambin.tsnet \
            -o ../../app/libs/tsnet.aar .

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PayamBin.apk


      - uses: actions/upload-artifact@v4
        with:
          name: PayamBin-apk
          path: PayamBin.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: PayamBin v${{ github.run_number }}
          files: PayamBin.apk
          make_latest: true
