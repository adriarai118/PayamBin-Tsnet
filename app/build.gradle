plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adriarai.payambin'
    compileSdk 34

    defaultConfig {
        applicationId 'com.adriarai.payambin.tsnet' // جدا از نسخهٔ اصلی، تا کنار آن نصب شود
        minSdk 26 // tsnet (gomobile) به API 26+ نیاز دارد؛ روی اندروید قدیمی‌تر نصب نمی‌شود
        targetSdk 34
        // شمارهٔ نسخه = شمارهٔ اجرای GitHub Actions (برای آپدیت خودکار)
        def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer
        versionCode run
        versionName "1." + run
    }

    // کلید ثابت تا نسخه‌های بعدی روی نسخهٔ قبلی نصب شوند (بدون حذف برنامه)
    signingConfigs {
        fixed {
            storeFile file('payambin.jks')
            storePassword 'payambin123'
            keyAlias 'payambin'
            keyPassword 'payambin123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // ماژول tsnet (Tailscale داخلی): فقط وقتی AAR ساخته شده باشد وصل می‌شود؛
    // اگر app/libs/tsnet.aar نباشد، TailscaleManager با reflection «در دسترس نیست»
    // گزارش می‌دهد و بقیهٔ برنامه عادی کار می‌کند. ساخت AAR را در TSNET.md ببینید.
    if (file('libs/tsnet.aar').exists()) {
        implementation files('libs/tsnet.aar')
    }
}
